<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <rect width="480" height="640" fill="#2A1F2E"/>
  <!-- slim slip -->
  <rect x="200" y="168" width="80" height="390" rx="2" fill="#49394F" opacity="0.9"/>
  <!-- kimono jacket — wide, draped -->
  <path d="M100 170 L200 185 L200 500 L100 540 Z" fill="#49394F"/>
  <path d="M380 170 L280 185 L280 500 L380 540 Z" fill="#49394F"/>
  <!-- kimono body -->
  <rect x="175" y="162" width="130" height="340" rx="0" fill="#3A2B42"/>
  <!-- lapel crossing -->
  <path d="M240 162 L195 230 L195 162 Z" fill="#2E2038"/>
  <path d="M240 162 L285 230 L285 162 Z" fill="#2E2038"/>
