  <line x1="100" y1="200" x2="175" y2="250" stroke="#6B5578" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="210" x2="305" y2="260" stroke="#6B5578" stroke-width="1" opacity="0.5"/>
  <!-- head -->
  <ellipse cx="240" cy="118" rx="38" ry="44" fill="#C8B898"/>
  <!-- stars -->
  <circle cx="420" cy="80" r="1.5" fill="#E5D9C3" opacity="0.6"/>
  <circle cx="60" cy="50" r="1" fill="#E5D9C3" opacity="0.5"/>
  <circle cx="400" cy="140" r="1" fill="#E5D9C3" opacity="0.4"/>
  <text x="240" y="628" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#E5D9C3" opacity="0.6">Look 06 / 06 — Night Passage</text>
</svg>
