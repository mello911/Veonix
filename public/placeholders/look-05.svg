  <!-- arms -->
  <rect x="145" y="175" width="50" height="110" rx="20" fill="#8C8F70"/>
  <rect x="285" y="175" width="50" height="110" rx="20" fill="#8C8F70"/>
  <!-- ankle gather lines -->
  <line x1="208" y1="560" x2="222" y2="568" stroke="#55593C" stroke-width="1"/>
  <line x1="258" y1="560" x2="272" y2="568" stroke="#55593C" stroke-width="1"/>
